<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: #e7f2ec;
        }

        .item {
            padding: 20px;
            background: white;
            border: 1px solid #176b50;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">Enzymes</div>
        <div class="item">Proteins</div>
        <div class="item">Metabolism</div>
    </div>
    <div class="container">
        <div class="item">Cellular Respiration</div>
        <div class="item">Photosynthesis</div>
        <div class="item">Cell Division</div>
    </div>
    <div class="container">
        <div class="item">DNA Replication</div>
        <div class="item">DNA Transcription</div>
        <div class="item">DNA Translation</div>
    </div>
</body>

</html>
